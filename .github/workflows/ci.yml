name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin header promises 7.4; the test container runs 8.3.
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l

  metadata:
    name: Plugin metadata is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Header version, constant and readme stable tag agree
        run: |
          header=$(sed -n 's/^ \* Version: *//p' contentrain-bridge.php | tr -d '[:space:]')
          constant=$(sed -n "s/.*CONTENTRAIN_BRIDGE_VERSION', *'\([^']*\)'.*/\1/p" contentrain-bridge.php)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '[:space:]')
          echo "header=$header constant=$constant stable=$stable"
          test "$header" = "$constant" && test "$header" = "$stable"
      - name: External requests are disclosed in readme.txt
        # The plugin calls the GitHub API. A readme that says otherwise is both
        # a WordPress.org review failure and an inaccurate privacy statement.
        run: |
          if grep -rqE 'wp_remote_(get|post|request|head)' includes/; then
            grep -q '= External services =' readme.txt
            grep -q 'api.github.com' readme.txt
          fi
          ! grep -qiE 'no external (network )?requests|makes no external requests' readme.txt README.md

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:wordpress
        env:
          KEEP: 1
      - run: npm run test:plugin
      # B-04: no-plugin case, then Yoast SEO + Redirection. Every exported head
      # value is compared with the page WordPress serves, every redirect is
      # requested, and @contentrain/verify establishes old/new parity from it.
      - run: npm run test:seo
      # B-06: T0 inventory through a real export, twelve mutations, an exact
      # delta, idempotency and the refusals. Mutates the throwaway site, so it
      # runs after the store the other gates read has been copied out.
      - run: npm run test:delta
      # Everything handed over — store and delta — scanned for planted secrets.
      - run: npm run test:secrets
      # Repeat delivery: deletions the delta proves are removed, unexplained ones
      # refused, a person's edit reported and resolved; replayed into real Git.
      - run: npm run test:delivery-git
      # B-11: export -> (GitHub) -> Astro build via @contentrain/query, three
      # edits, second export, Git diff, rebuild. The GitHub leg runs only when
      # the repository secrets exist; otherwise it is reported as skipped.
      - run: npm run test:e2e
        env:
          BRIDGE_TEST_REPO: ${{ secrets.BRIDGE_TEST_REPO }}
          BRIDGE_TEST_TOKEN: ${{ secrets.BRIDGE_TEST_TOKEN }}
          BRIDGE_TEST_RESET: ${{ secrets.BRIDGE_TEST_RESET }}
      - run: npm run test:store
      # The reader gate: this writer's own output, read back with the pinned
      # @contentrain/types. It decides whether escape-bearing metadata survives,
      # so a reader regression fails here rather than in a customer's store.
      - run: npm run test:reader
      - run: npm test
      - name: WordPress uninstall cleanup
        run: docker compose -f tests/compose.yml run --rm -T cli eval-file /var/www/html/wp-content/plugins/contentrain-bridge/tests/uninstall.php
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: contentrain-bridge
          path: dist/contentrain-bridge.zip
      - name: Remove acceptance containers
        if: always()
        run: docker compose -f tests/compose.yml down -v
