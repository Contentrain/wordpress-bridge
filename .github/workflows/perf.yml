name: perf
# BR-23: how long a Migrate-style export of a large site takes. Not a gate: a
# measurement, run on demand and when the measuring scripts change.
on:
  workflow_dispatch:
    inputs:
      posts: { description: Posts, default: '5000' }
      attachments: { description: Attachment records, default: '20000' }
      comments: { description: Comments, default: '20000' }
  pull_request:
    paths:
      - tests/perf/**
      - .github/workflows/perf.yml
permissions:
  contents: read
jobs:
  large-site-export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: tests/perf/run.sh "${{ inputs.posts || '5000' }}" "${{ inputs.attachments || '20000' }}" "${{ inputs.comments || '20000' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: tests/.out/perf-report.json
          if-no-files-found: ignore
